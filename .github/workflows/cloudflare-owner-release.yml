name: Owner-controlled Cloudflare scheduler release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      apply_source:
        required: false
        type: string
        default: ''
      resolve_cancelled_run:
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

# One existing credential carrier; this matches that carrier's incident lock.
concurrency:
  group: cloudflare-kv-incident-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_id == '1255213941' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_SOURCE_SHA: ${{ inputs.source_sha }}
      OPS_APPLY_SOURCE: ${{ inputs.apply_source }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 4444J99/ops
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact accepted owner revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPS_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$OPS_SOURCE_SHA" ]]
          git merge-base --is-ancestor "$OPS_SOURCE_SHA" refs/remotes/origin/main
          if [[ -n "$OPS_APPLY_SOURCE" ]]; then
            [[ "$OPS_APPLY_SOURCE" == "$OPS_SOURCE_SHA" ]]
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate and build before exposing a provider credential
        id: validate_owner
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci
          npm run typecheck
          npm run check:boundaries
          npm test
          npm run test:isolated
          node --test test/d1-runtime.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          npm run build
          node scripts/verify-boundaries.mjs --emit
      - name: Inspect exact live source and resource boundaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/release.py
          cp "$RUNNER_TEMP/ops-owner-release.json" "$RUNNER_TEMP/ops-owner-preflight.json"
      - name: Apply only the explicitly named accepted source
        if: inputs.apply_source != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/release.py --apply
      - name: Reconcile only the explicitly named cancelled poll
        # The repair independently checks source, clocks, database and exact run
        # custody. A stale readiness projection must not hide that repair path.
        if: always() && !cancelled() && steps.validate_owner.outcome == 'success' && inputs.resolve_cancelled_run != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_RESOLVE_RUN: ${{ inputs.resolve_cancelled_run }}
        run: python3 scripts/resolve_cancelled.py
      - name: Read per-run custody and product acknowledgement evidence
        # A stale runtime must not hide the evidence needed to repair it.
        # Validation is still required; failed preflight remains failed.
        if: always() && !cancelled() && steps.validate_owner.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/runtime_evidence.py
          python3 scripts/uncertain_logs.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ops-owner-release-receipt
          path: ${{ runner.temp }}/ops-owner-*.json
          if-no-files-found: warn
          retention-days: 7
