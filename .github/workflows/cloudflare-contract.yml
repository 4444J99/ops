name: Shared operations contract

on:
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-contract.yml', '.github/workflows/cloudflare-owner-release.yml']
  push:
    branches: [main]
    paths: ['cloudflare/**', '.github/workflows/cloudflare-contract.yml', '.github/workflows/cloudflare-owner-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-operations-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run test:isolated
      - name: Exercise the actual local Cloudflare D1 binding
        run: node --test test/d1-runtime.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build without provider credentials
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run build
          node scripts/verify-boundaries.mjs --emit
      - name: Preserve exact test inputs and build evidence
        if: always()
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          tar --exclude='__pycache__' -czf "${RUNNER_TEMP}/ops-contract-inputs.tgz" src test scripts migrations package.json package-lock.json tsconfig.json vitest.config.ts wrangler.toml wrangler-no-cron.toml SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-contract-inputs
          path: ${{ runner.temp }}/ops-contract-inputs.tgz
          retention-days: 3
          if-no-files-found: error
